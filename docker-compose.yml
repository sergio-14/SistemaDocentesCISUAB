# ============================================================
# PRODUCCIÓN — Dokploy (guía IIISyP: github.com/sergio-14/Documentacion_IIISyP)
#
# Dokploy > Compose Path: ./docker-compose.yml
# Dokploy > Domains:      Service "frontend", Port 80, HTTPS (Let's Encrypt)
#
# Un solo dominio: el nginx del servicio "frontend" es la única entrada y
# reenvía /api, /media y /static al backend y /ws/ (WebSockets) a realtime por la red
# interna. El admin de Django (/django-admin/) está apagado en producción (DJANGO_ADMIN_ENABLED).
#
# Tiempo real (avisos, chat y listas al instante): servicios redis y realtime. Para
# apagarlo sin quitarlos: VITE_TIEMPO_REAL=false (ver README, "Tiempo real").
#
# - Sin "ports:" ni "container_name" (reglas 4 y 5).
# - PostgreSQL 16 sin puerto publicado (reglas 1 y 6).
# - Datos en volúmenes con nombre (regla 7).
# - Backend con usuario no-root (regla 8).
# - restart + healthcheck en cada servicio (regla 10).
#
# Prueba local: requiere la red externa de Dokploy
#   docker network create dokploy-network
#   docker compose -f docker-compose.yml --env-file .env.production.local up -d --build
# Desarrollo local: docker-compose.dev.yml
# ============================================================

# Entorno común de backend (API, gunicorn) y realtime (WebSockets, uvicorn).
x-entorno-backend: &entorno-backend
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Falta DJANGO_SECRET_KEY}
  DJANGO_DEBUG: "False"
  # Admin de Django apagado; para activarlo también hay que exponerlo en frontend/nginx.conf.
  DJANGO_ADMIN_ENABLED: ${DJANGO_ADMIN_ENABLED:-False}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?Falta DJANGO_ALLOWED_HOSTS}
  DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:?Falta DJANGO_CSRF_TRUSTED_ORIGINS}
  POSTGRES_HOST: db
  POSTGRES_PORT: 5432
  POSTGRES_DB: ${POSTGRES_DB}
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  PROFILE_IMAGE_ENCRYPTION_KEY: ${PROFILE_IMAGE_ENCRYPTION_KEY:-}
  MEDIA_URL_MAX_AGE: ${MEDIA_URL_MAX_AGE:-3600}
  SECURE_HSTS_SECONDS: ${SECURE_HSTS_SECONDS:-0}
  REDIS_URL: redis://redis:6379/0

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Falta POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Falta POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Tarea de un solo uso: el backend corre sin root (UID 10001) y el volumen de
  # archivos subidos puede haberse creado como root (por otro servicio o por un
  # despliegue anterior). Ajusta el dueño antes de arrancar backend y backup.
  media-permisos:
    image: alpine:3.20
    restart: "no"
    volumes:
      - media_data:/app/media
    command: ["sh", "-c", "find /app/media ! -user 10001 -exec chown 10001:10001 {} +"]

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      <<: *entorno-backend
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-3}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-120}
    volumes:
      - media_data:/app/media
    expose:
      - "8000"
    healthcheck:
      # Usa el primer host permitido: Django rechaza (400) hosts fuera de ALLOWED_HOSTS.
      test:
        - CMD
        - python
        - -c
        - "import os,urllib.request as r; h=os.environ['DJANGO_ALLOWED_HOSTS'].split(',')[0].strip(); r.urlopen(r.Request('http://127.0.0.1:8000/health/', headers={'Host': h}), timeout=5)"
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 90s
    depends_on:
      db:
        condition: service_healthy
      media-permisos:
        condition: service_completed_successfully
      # Si redis no respondiera, la API igual funciona (solo se pierde el tiempo real).
      redis:
        condition: service_started

  # Solo pasa mensajes entre backend y realtime: sin guardar en disco y con tope de
  # memoria (en uso real, pocos MB). Sin puerto publicado.
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 3

  # WebSockets (/ws/): la misma imagen del backend con uvicorn (ASGI). La API sigue en
  # gunicorn. Sin el entrypoint: las migraciones las corre el backend, del que depende.
  realtime:
    build:
      context: ./backend
    restart: unless-stopped
    entrypoint: []
    command: ["uvicorn", "config.asgi:application", "--host", "0.0.0.0", "--port", "8001", "--proxy-headers", "--forwarded-allow-ips", "*"]
    environment: *entorno-backend
    expose:
      - "8001"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os,urllib.request as r; h=os.environ['DJANGO_ALLOWED_HOSTS'].split(',')[0].strip(); r.urlopen(r.Request('http://127.0.0.1:8001/health/', headers={'Host': h}), timeout=5)"
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: ${VITE_API_URL:?Falta VITE_API_URL}
        # "false" apaga el tiempo real: el frontend no abre el socket y consulta como antes.
        VITE_TIEMPO_REAL: ${VITE_TIEMPO_REAL:-true}
    restart: unless-stopped
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    # Único servicio que recibe tráfico de Traefik.
    networks:
      - default
      - dokploy-network
    depends_on:
      backend:
        condition: service_healthy

  # Backup periódico y CIFRADO (GPG, BACKUP_PASSPHRASE) de la BD y de media_data en
  # el volumen "backups". Quedan en el mismo servidor: descargarlos a otra máquina
  # con scripts/descargar-backup.ps1 (ver README, "Backups").
  backup:
    build:
      context: ./backup
    restart: unless-stopped
    volumes:
      - backups:/backups
      - media_data:/media:ro
    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_FIRST_DELAY_MINUTES: ${BACKUP_FIRST_DELAY_MINUTES:-10}
      # Contraseña para cifrar los backups. Opcional para desplegar: sin ella el servicio
      # arranca pero no genera backups (nunca sin cifrar) y lo avisa en sus logs.
      # Sin ella los backups no se pueden abrir: guardarla fuera del servidor.
      BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE:-}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h db -U $${PGUSER} -d $${PGDATABASE}"]
      interval: 60s
      timeout: 5s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
      media-permisos:
        condition: service_completed_successfully

volumes:
  postgres_data:
  media_data:
  backups:

networks:
  dokploy-network:
    external: true
