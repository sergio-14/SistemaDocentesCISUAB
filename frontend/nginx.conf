# Único punto de entrada del sistema (guía IIISyP: Django detrás de nginx, puerto 80).
# Traefik (Dokploy) termina el HTTPS y envía aquí todo el tráfico del dominio:
#   /api/, /django-admin/, /media/, /static/  -> backend (gunicorn)
#   todo lo demás                             -> SPA de React

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Evidencias, actas y respaldos: el valor por defecto de nginx (1 MB) es insuficiente.
    client_max_body_size 50M;

    # DNS interno de Docker: el nombre "backend" se resuelve en cada petición, así un
    # redeploy del backend (nueva IP) no deja a nginx apuntando a un contenedor viejo.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8000;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location ~ ^/(api|django-admin|media|static)/ {
        proxy_pass $backend;
        proxy_http_version 1.1;

        # Se reenvían las cabeceras que manda Traefik: dentro de la red Docker
        # $scheme sería siempre http y $remote_addr la IP de Traefik.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $http_x_real_ip;
        proxy_set_header X-Forwarded-For   $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

        # El reporte general del POA puede tardar hasta el timeout de gunicorn (120 s).
        proxy_read_timeout 130s;
        proxy_redirect off;
    }

    # Archivos con hash en el nombre: se pueden cachear indefinidamente.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # index.html nunca se cachea, para que cada despliegue se vea al instante.
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # SPA: cualquier ruta de React Router (incluida /admin) devuelve index.html.
    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ /index.html;
    }
}
